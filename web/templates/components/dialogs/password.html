{{ define "dialog-password" }}
<dialog id="pw-dialog">
  <form id="pw-form" method="dialog">
    <h3 id="pw-title">Cambiar contraseña</h3>
    <p class="note" id="pw-note"></p>
    <div id="pw-current-wrap"><label for="pw-current">Contraseña actual</label><input class="field" id="pw-current" type="password" autocomplete="current-password"></div>
    <label for="pw-new">Nueva contraseña</label><input class="field" id="pw-new" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
    <label for="pw-confirm">Repetir contraseña</label><input class="field" id="pw-confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
    <p class="form-msg err" id="pw-msg" role="alert"></p>
    <div class="dialog-actions"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>
  </form>
</dialog>
{{ end }}
