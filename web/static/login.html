<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GO-DATA | Iniciar sesión</title>
  <style>
    :root{--bg:#071421;--fg:#d7e1e8;--card:#10283c;--primary:#5cbdb9;--muted:#8da3b4;--border:rgba(92,132,157,.34);--crit:#e2665c;--radius:8px;--shadow:0 20px 55px -42px rgba(0,5,16,.8);font-family:Arial,"Helvetica Neue",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg)}
    .card{width:100%;max-width:360px;border:1px solid var(--border);background:rgba(16,40,60,.72);box-shadow:var(--shadow);border-radius:var(--radius);padding:24px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:32px;height:32px;display:grid;place-items:center;background:rgba(92,189,185,.14);color:var(--primary);border:1px solid rgba(92,189,185,.22);border-radius:6px;font-size:11px;font-weight:700}
    .eyebrow{margin:0;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}h1{margin:2px 0 0;font-size:14px;font-weight:600}
    label{display:block;color:var(--muted);font-size:11px;margin:14px 0 6px}
    input{width:100%;font:inherit;font-size:13px;color:var(--fg);background:rgba(7,20,33,.62);border:1px solid var(--border);border-radius:6px;padding:9px 10px;outline:none}input:focus{border-color:var(--primary)}
    button{width:100%;margin-top:20px;font:inherit;font-size:13px;font-weight:600;color:var(--bg);background:var(--primary);border:0;border-radius:6px;padding:10px;cursor:pointer}button:disabled{opacity:.6;cursor:default}
    .pw-wrap{position:relative;display:block}.pw-wrap input{padding-right:38px}.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;margin:0;padding:0;display:grid;place-items:center;background:none;border:0;border-radius:4px;color:var(--muted);cursor:pointer}.pw-toggle:hover,.pw-toggle:focus-visible{color:var(--primary)}.pw-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .error{min-height:16px;margin:12px 0 0;color:var(--crit);font-size:12px}
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand">
      <div class="logo">GD</div>
      <div><p class="eyebrow">GO-DATA · Consola</p><h1>Iniciar sesión</h1></div>
    </div>
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" id="submit">Entrar</button>
  </form>
<script>
// Si ya hay sesión (o el login por sesión no está activo), ir directo al panel.
fetch("/api/auth/me").then((r) => { if (r.ok) location.replace("/"); }).catch(() => {});

// Ojito para ver/ocultar la contraseña en cada input[type=password].
function addPasswordToggles(root = document) {
  root.querySelectorAll('input[type="password"]').forEach((input) => {
    const dialog = input.closest("dialog");
    const wrap = document.createElement("span");
    wrap.className = "pw-wrap";
    input.replaceWith(wrap);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pw-toggle";
    const sync = () => {
      const shown = input.type === "text";
      btn.setAttribute("aria-label", shown ? "Ocultar contraseña" : "Mostrar contraseña");
      btn.setAttribute("aria-pressed", String(shown));
      btn.title = btn.getAttribute("aria-label");
      btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${shown ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/>' : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'}</svg>`;
    };
    btn.addEventListener("click", () => {
      input.type = input.type === "password" ? "text" : "password";
      sync();
      input.focus();
    });
    // Al cerrar un modal la contraseña vuelve a quedar oculta.
    dialog?.addEventListener("close", () => { input.type = "password"; sync(); });
    sync();
    wrap.append(input, btn);
  });
}
addPasswordToggles();

const form = document.getElementById("form");
const errorEl = document.getElementById("error");
const submit = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.textContent = "";
  submit.disabled = true;
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value }),
    });
    if (res.ok) {
      location.replace("/");
      return;
    }
    const json = await res.json().catch(() => ({}));
    errorEl.textContent = json.error || "no se pudo iniciar sesión";
    form.password.value = "";
    form.password.focus();
  } catch {
    errorEl.textContent = "no se pudo conectar con el servidor";
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
