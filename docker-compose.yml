version: "3.9"

services:
  app:
    build: .
    image: gonzxa/go-data:latest
    # Host networking (instead of bridge + published port) so the network
    # monitor's netlink conntrack socket resolves against the HOST's root
    # network namespace, not this container's own — otherwise it would only
    # ever see this container's own traffic, never sibling containers'
    # (Minecraft/Crafty/etc.) connections. Docker ignores `ports:` entirely
    # in this mode, so PORT below is what makes the dashboard still land on
    # :19245 instead of the app's default :9000.
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /proc:/hostproc:ro
      - app-data:/app/data
    environment:
      - PORT=19245
      - USE_INFLUX=true
      # Compose's embedded DNS (http://influx:8086) isn't reachable once
      # this service is off the shared bridge network — reach influx via
      # its own published host port instead.
      - INFLUX_URL=http://localhost:19246
      - INFLUX_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUX_ORG=${INFLUXDB_ORG}
      - INFLUX_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_ENABLED=true
      - SSH_WATCH_ENABLED=true
      - CONN_WATCH_ENABLED=true
      - CONN_WATCH_AUTO=true
      - NETMON_ENABLED=true
      - AUTH_ENABLED=true
      - AUTH_USER=${AUTH_USER}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
    depends_on:
      - influx
  influx:
    image: influxdb:2.7
    ports:
      - "19246:8086"
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}

volumes:
  app-data:
  influx-data:
  influx-config:
